modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# ParCool is optional: if it's installed we read its stamina value directly
# for the stamina ring; if it's not installed, the mod still loads fine and
# the stamina ring is simply not drawn (see VitalsHudOverlay).
[[dependencies.${mod_id}]]
    modId="parcool"
    mandatory=false
    versionRange="[3.4.3,)"
    ordering="AFTER"
    side="CLIENT"
